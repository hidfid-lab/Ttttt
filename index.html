<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniPass 歐米通：穩定相機與掃描版</title>
    <!-- 引入 ZBar WASM 核心 -->
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@latest/dist/index.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; margin: 0; padding: 12px; color: #f8fafc; }
        .container { max-width: 480px; margin: 0 auto; background: #1e293b; padding: 16px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-size: 1.1rem; margin-top: 0; color: #38bdf8; text-align: center; }
        .action-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 16px; background: #10b981; color: white; }
        .action-btn.stop { background: #ef4444; }
        .status-bar { margin-top: 12px; padding: 10px; background: #0f172a; border-radius: 8px; font-size: 0.8rem; color: #38bdf8; border: 1px solid #334155; }
        .video-container { position: relative; width: 100%; border-radius: 12px; overflow: hidden; margin-top: 12px; background: #000; display: none; border: 2px solid #334155; }
        video { width: 100%; display: block; object-fit: cover; max-height: 280px; }
        .roi-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 120px; border: 2px dashed #38bdf8; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none; border-radius: 8px; }
        .result-box { margin-top: 10px; padding: 10px; background: #0f172a; border-radius: 8px; font-size: 0.85rem; word-break: break-all; border: 1px solid #334155; }
    </style>
</head>
<body>

<div class="container">
    <h2>OmniPass 歐米通：穩定相機版</h2>

    <button class="action-btn" id="mainBtn" onclick="toggleScanner()">▶ 啟動視訊連續掃描</button>

    <div class="status-bar" id="statusBar">
        狀態：等待啟動...
    </div>

    <div class="video-container" id="videoContainer">
        <video id="video" muted playsinline autoplay></video>
        <div class="roi-box"></div>
    </div>

    <div class="result-box" id="resultArea">
        <strong>掃描結果：</strong> 尚未讀取
    </div>
</div>

<script>
    let mediaStream = null;
    let scanInterval = null;
    let isScanning = false;
    let isProcessing = false;

    async function toggleScanner() {
        if (!isScanning) { 
            await startScanner(); 
        } else { 
            stopScanner(); 
        }
    }

    async function startScanner() {
        const mainBtn = document.getElementById('mainBtn');
        const videoContainer = document.getElementById('videoContainer');
        const videoElement = document.getElementById('video');
        const resultArea = document.getElementById('resultArea');
        const statusBar = document.getElementById('statusBar');

        try {
            // 檢查 ZBar WASM 是否載入
            if (typeof zbarWasm === 'undefined') {
                throw new Error("ZBar WASM 核心尚未就緒，請檢查網路連線。");
            }

            mainBtn.innerText = '⏹ 關閉視訊掃描';
            mainBtn.classList.add('stop');
            isScanning = true;
            videoContainer.style.display = 'block';
            statusBar.innerText = '狀態：正在開啟相機...';

            // 使用相容性極佳的串流設定（優先尋找後鏡頭，若無則退回預設鏡頭）
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
                });
            } catch (errEnv) {
                console.warn("無法取得環境後鏡頭，嘗試一般相機：", errEnv);
                mediaStream = await navigator.mediaDevices.getUserMedia({ video: true });
            }

            videoElement.srcObject = mediaStream;
            await videoElement.play();
            statusBar.innerText = '狀態：相機運行中，尋找條碼...';

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d', { willReadFrequently: true });

            // 啟動高效辨識迴圈
            scanInterval = setInterval(async () => {
                if (isProcessing) return;
                if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                    isProcessing = true;
                    try {
                        // 畫布降載以提升處理速度
                        canvas.width = 640;
                        canvas.height = videoElement.videoHeight * (640 / videoElement.videoWidth);

                        context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

                        const symbols = await zbarWasm(canvas);
                        if (symbols && symbols.length > 0) {
                            for (let symbol of symbols) {
                                const codeText = symbol.decode();
                                if (codeText) {
                                    resultArea.innerHTML = `
                                        <div style="color: #4ade80; font-weight: bold;">🎉 成功捕捉！</div>
                                        <div>類型：${symbol.typeName}</div>
                                        <div>內容：<code>${codeText}</code></div>
                                    `;
                                    if (navigator.vibrate) navigator.vibrate(100);
                                    stopScanner();
                                    break;
                                }
                            }
                        }
                    } catch (e) {
                        console.error("辨識執行緒錯誤：", e);
                    }
                    isProcessing = false;
                }
            }, 150);

        } catch (err) {
            alert("無法開啟相機：" + err.message);
            stopScanner();
        }
    }

    function stopScanner() {
        if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
        if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); mediaStream = null; }
        document.getElementById('video').srcObject = null;
        document.getElementById('videoContainer').style.display = 'none';
        const mainBtn = document.getElementById('mainBtn');
        mainBtn.innerText = '▶ 啟動視訊連續掃描';
        mainBtn.classList.remove('stop');
        isScanning = false;
        isProcessing = false;
        document.getElementById('statusBar').innerText = '狀態：已停止';
    }
</script>

</body>
</html>

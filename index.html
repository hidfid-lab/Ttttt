<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全家極速條碼掃描器</title>
    <!-- 引入高效能的 html5-qrcode 函式庫 -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; margin: 0; padding: 16px; color: #f8fafc; }
        .container { max-width: 480px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-size: 1.2rem; margin-top: 0; color: #fb923c; text-align: center; }
        #reader { width: 100%; border-radius: 12px; overflow: hidden; margin-top: 12px; background: #000; border: 2px solid #334155; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 12px; transition: background 0.2s; }
        .btn-start { background: #f97316; color: white; }
        .btn-start:hover { background: #ea580c; }
        .btn-stop { background: #ef4444; color: white; display: none; }
        .result-box { margin-top: 15px; padding: 14px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; font-size: 0.95rem; word-break: break-all; }
        .success-text { color: #4ade80; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>🧡 全家專用 Code 39 極速掃描</h2>
    
    <!-- 攝影機預覽畫面 -->
    <div id="reader"></div>

    <button class="btn btn-start" id="startBtn" onclick="startScanner()">▶ 啟動鏡頭掃描</button>
    <button class="btn btn-stop" id="stopBtn" onclick="stopScanner()">⏹ 關閉鏡頭</button>

    <div class="result-box" id="resultArea">
        <strong>掃醒狀態：</strong> 準備就緒，請將全家條碼置於鏡頭前
    </div>
</div>

<script>
    let html5QrCode;
    let isRunning = false;

    async function startScanner() {
        if (isRunning) return;

        html5QrCode = new Html5Qrcode("reader");
        
        // 針對一維條碼優化的設定：拉高 fps、強制指定 CODE_39
        const config = {
            fps: 20,
            qrbox: { width: 320, height: 140 },
            formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_39 ]
        };

        try {
            await html5QrCode.start(
                { facingMode: "environment" },
                config,
                (decodedText, decodedResult) => {
                    // 成功抓取條碼時的回調
                    document.getElementById('resultArea').innerHTML = `
                        <div class="success-text">🎉 成功讀取！</div>
                        <div>內容：<code>${decodedText}</code></div>
                    `;
                    // 震動回饋（支援的手機裝置會震動）
                    if (navigator.vibrate) navigator.vibrate(100);
                },
                (errorMessage) => {
                    // 略過未對準時的每影格掃描失敗訊息，保持效能流暢
                }
            );

            isRunning = true;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('stopBtn').style.display = 'block';
        } catch (err) {
            alert("無法啟動相機，請檢查權限或 HTTPS 環境：" + err);
        }
    }

    async function stopScanner() {
        if (!isRunning || !html5QrCode) return;
        try {
            await html5QrCode.stop();
            isRunning = false;
            document.getElementById('startBtn').style.display = 'block';
            document.getElementById('stopBtn').style.display = 'none';
            document.getElementById('resultArea').innerHTML = '<strong>掃描狀態：</strong> 已停止';
        } catch (err) {
            console.error("關閉相機失敗", err);
        }
    }
</script>

</body>
</html>

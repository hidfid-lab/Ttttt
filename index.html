<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全家 Code 39 - 參數化極速掃描器</title>
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@latest/dist/index.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; margin: 0; padding: 16px; color: #f8fafc; }
        .container { max-width: 480px; margin: 0 auto; background: #1e293b; padding: 20px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-size: 1.2rem; margin-top: 0; color: #fb923c; text-align: center; }
        .config-box { background: #0f172a; padding: 10px 14px; border-radius: 8px; font-size: 0.85rem; margin-bottom: 12px; color: #94a3b8; }
        .video-container { position: relative; width: 100%; border-radius: 12px; overflow: hidden; margin-top: 12px; background: #000; border: 2px solid #334155; }
        video { width: 100%; display: block; object-fit: cover; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 12px; transition: background 0.2s; }
        .btn-start { background: #f97316; color: white; }
        .btn-stop { background: #ef4444; color: white; display: none; }
        .result-box { margin-top: 15px; padding: 14px; background: #0f172a; border: 1px solid #334155; border-radius: 10px; font-size: 0.95rem; word-break: break-all; }
        .success-text { color: #4ade80; font-weight: bold; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="container">
    <h2>🧡 參數化極速掃描器</h2>
    
    <div class="config-box">
        ⚙️ 當前參數設定：最小長度 8 | 最大長度 25 | 掃描間隔 150ms
    </div>

    <div class="video-container">
        <video id="video" muted playsinline autoplay></video>
    </div>

    <button class="btn btn-start" id="startBtn" onclick="startScanner()">▶ 啟動參數化掃描</button>
    <button class="btn btn-stop" id="stopBtn" onclick="stopScanner()">⏹ 關閉相機</button>

    <div class="result-box" id="resultArea">
        <strong>掃描狀態：</strong> 準備就緒
    </div>
</div>

<script>
    let mediaStream = null;
    let scanInterval = null;
    let lastScanTime = 0;
    
    // 模仿 OmniPass 的參數設定
    const config = {
        minLength: 8,
        maxLength: 25,
        cooldown: 1200, // 成功後的冷卻時間 (毫秒)
        interval: 150   // 掃描頻率 (毫秒)
    };

    async function startScanner() {
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const resultArea = document.getElementById('resultArea');
        const videoElement = document.getElementById('video');

        startBtn.style.display = 'none';
        stopBtn.style.display = 'block';
        resultArea.innerHTML = '<strong>掃描狀態：</strong> 正在初始化...';

        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: { exact: 'environment' } }
            }).catch(() => {
                return navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            });

            videoElement.srcObject = mediaStream;
            await videoElement.play();

            resultArea.innerHTML = '<strong>掃描狀態：</strong> 嚴格過濾中，請對準條碼...';

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d', { willReadFrequently: true });

            scanInterval = setInterval(async () => {
                const now = Date.now();
                if (now - lastScanTime < config.cooldown) return; // 冷卻中跳過

                if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                    canvas.width = videoElement.videoWidth;
                    canvas.height = videoElement.videoHeight;
                    context.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

                    try {
                        const symbols = await zbarWasm(canvas);
                        if (symbols && symbols.length > 0) {
                            for (let symbol of symbols) {
                                const codeText = symbol.decode();
                                const codeLen = codeText.length;

                                // 關鍵過濾：檢查是否符合設定的最小與最大長度範圍
                                if (codeLen >= config.minLength && codeLen <= config.maxLength) {
                                    lastScanTime = now;
                                    resultArea.innerHTML = `
                                        <div class="success-text">🎉 精準命中！</div>
                                        <div>格式：${symbol.typeName}</div>
                                        <div>長度：${codeLen} 碼</div>
                                        <div>內容：<code>${codeText}</code></div>
                                    `;
                                    if (navigator.vibrate) navigator.vibrate(100);
                                    
                                    // 找到後暫停或保持冷卻
                                    break;
                                }
                            }
                        }
                    } catch (e) {
                        // 略過未命中時的例外
                    }
                }
            }, config.interval);

        } catch (err) {
            alert("啟動失敗：" + err);
            stopScanner();
        }
    }

    function stopScanner() {
        if (scanInterval) {
            clearInterval(scanInterval);
            scanInterval = null;
        }
        if (mediaStream) {
            mediaStream.getTracks().forEach(track => track.stop());
            mediaStream = null;
        }
        document.getElementById('video').srcObject = null;
        document.getElementById('startBtn').style.display = 'block';
        document.getElementById('stopBtn').style.display = 'none';
        document.getElementById('resultArea').innerHTML = '<strong>掃描狀態：</strong> 已停止';
    }
</script>

</body>
</html>

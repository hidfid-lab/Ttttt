<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniPass 歐米通：相容穩定版</title>
    <!-- 改用全域 UMD 版本的 zbar-wasm，避免 import 阻擋 -->
    <script src="https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@latest/dist/index.js"></script>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #13111c; margin: 0; padding: 16px; color: #f8fafc; }
        .container { max-width: 480px; margin: 0 auto; background: #1e1b2e; padding: 20px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        
        .section-title { font-size: 0.95rem; font-weight: bold; margin: 16px 0 8px 0; color: #cbd5e1; display: flex; align-items: center; gap: 6px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 12px; }
        .opt-btn { flex: 1; padding: 12px 8px; border: 1px solid #3b3554; background: #2a253e; color: #94a3b8; border-radius: 10px; font-weight: bold; font-size: 0.9rem; cursor: pointer; transition: all 0.2s; }
        .opt-btn.active { background: #8b5cf6; color: #ffffff; border-color: #a78bfa; box-shadow: 0 0 12px rgba(139, 92, 246, 0.4); }
        
        .info-card { background: #171424; border: 1px solid #2e2845; border-radius: 12px; padding: 12px; margin: 16px 0; font-size: 0.85rem; }
        .info-text { color: #d8b4fe; margin-bottom: 8px; font-weight: bold; }
        .badge { display: inline-block; background: #064e3b; color: #34d399; padding: 4px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; }
        
        .main-btn { width: 100%; padding: 16px; border: none; border-radius: 12px; font-weight: bold; font-size: 1.1rem; cursor: pointer; background: #00d294; color: #052e16; margin-bottom: 16px; transition: all 0.2s; }
        .main-btn.stop { background: #ef4444; color: #ffffff; }
        
        .video-container { position: relative; width: 100%; border-radius: 14px; overflow: hidden; background: #000; display: none; margin-bottom: 16px; border: 2px solid #8b5cf6; }
        video { width: 100%; display: block; object-fit: cover; max-height: 260px; }
        .roi-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 85%; height: 120px; border: 2px dashed #a78bfa; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none; border-radius: 8px; }
        
        .result-card { background: #171424; border: 1px solid #2e2845; border-radius: 12px; padding: 14px; margin-bottom: 20px; font-size: 0.9rem; color: #cbd5e1; word-break: break-all; }
        .card-list-title { font-size: 1rem; font-weight: bold; color: #a78bfa; margin-bottom: 12px; }
        .empty-tip { text-align: center; color: #64748b; font-size: 0.85rem; padding: 20px 0; }
        .saved-item { background: #2a253e; border: 1px solid #3b3554; border-radius: 10px; padding: 10px; margin-bottom: 8px; font-size: 0.85rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="section-title">① 通路 (決定條碼格式)</div>
    <div class="btn-group">
        <button class="opt-btn active" id="btnChannelA">通路 A (7-11)</button>
        <button class="opt-btn" id="btnChannelB">通路 B (全家)</button>
    </div>

    <div class="section-title">② 卡片種類</div>
    <div class="btn-group">
        <button class="opt-btn active" id="btnTypeProduct">商品卡</button>
        <button class="opt-btn" id="btnTypeDrink">飲品卡</button>
    </div>

    <div class="section-title">③ 掃描模式</div>
    <div class="btn-group">
        <button class="opt-btn" id="btnModeDual">上下雙條碼</button>
        <button class="opt-btn active" id="btnModeSingle">單一條碼</button>
    </div>

    <div class="info-card">
        <div class="info-text" id="settingStatus">目前設定：通路A(7-11)．商品卡．單條碼．CODE128</div>
        <span class="badge">全域同步相容版</span>
    </div>

    <button class="main-btn" id="mainBtn">▶ 啟動掃描</button>

    <div class="video-container" id="videoContainer">
        <video id="video" muted playsinline autoplay></video>
        <div class="roi-box"></div>
    </div>

    <div class="result-card" id="resultArea">
        <strong>掃描結果：</strong> 尚未讀取
    </div>

    <div class="card-list-title">已收錄卡片</div>
    <div id="cardList">
        <div class="empty-tip">尚未收錄任何卡片</div>
    </div>
</div>

<script>
    let currentChannel = 'A'; // A: 7-11 (CODE128), B: 全家 (CODE39)
    let currentType = 'product'; // product: 商品卡, drink: 飲品卡
    let currentMode = 'single'; // single: 單條碼, dual: 上下雙條碼

    let isScanning = false;
    let isProcessing = false;
    let mediaStream = null;
    let animFrameId = null;
    let dualBuffers = [];

    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d', { willReadFrequently: true });

    // 確保 DOM 載入完成後才繫結事件
    document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('btnChannelA').addEventListener('click', () => {
            currentChannel = 'A';
            document.getElementById('btnChannelA').classList.add('active');
            document.getElementById('btnChannelB').classList.remove('active');
            updateStatus();
        });

        document.getElementById('btnChannelB').addEventListener('click', () => {
            currentChannel = 'B';
            document.getElementById('btnChannelB').classList.add('active');
            document.getElementById('btnChannelA').classList.remove('active');
            updateStatus();
        });

        document.getElementById('btnTypeProduct').addEventListener('click', () => {
            currentType = 'product';
            document.getElementById('btnTypeProduct').classList.add('active');
            document.getElementById('btnTypeDrink').classList.remove('active');
            updateStatus();
        });

        document.getElementById('btnTypeDrink').addEventListener('click', () => {
            currentType = 'drink';
            document.getElementById('btnTypeDrink').classList.add('active');
            document.getElementById('btnTypeProduct').classList.remove('active');
            updateStatus();
        });

        document.getElementById('btnModeDual').addEventListener('click', () => {
            currentMode = 'dual';
            document.getElementById('btnModeDual').classList.add('active');
            document.getElementById('btnModeSingle').classList.remove('active');
            updateStatus();
        });

        document.getElementById('btnModeSingle').addEventListener('click', () => {
            currentMode = 'single';
            document.getElementById('btnModeSingle').classList.add('active');
            document.getElementById('btnModeDual').classList.remove('active');
            updateStatus();
        });

        document.getElementById('mainBtn').addEventListener('click', () => {
            if (!isScanning) {
                startScanner();
            } else {
                stopScanner();
            }
        });
    });

    function updateStatus() {
        const chText = currentChannel === 'A' ? '通路A(7-11)' : '通路B(全家)';
        const tpText = currentType === 'product' ? '商品卡' : '飲品卡';
        const mdText = currentMode === 'single' ? '單條碼' : '上下雙條碼';
        const codeText = currentChannel === 'A' ? 'CODE128' : 'CODE39';
        
        document.getElementById('settingStatus').innerText = `目前設定：${chText}．${tpText}．${mdText}．${codeText}`;
    }

    async function startScanner() {
        const video = document.getElementById('video');
        const mainBtn = document.getElementById('mainBtn');
        const videoContainer = document.getElementById('videoContainer');
        const resultArea = document.getElementById('resultArea');

        dualBuffers = [];
        resultArea.innerHTML = '<strong>掃描結果：</strong> 正在開啓相機...';

        try {
            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            }).catch(() => navigator.mediaDevices.getUserMedia({ video: true }));

            video.srcObject = mediaStream;
            await video.play();

            isScanning = true;
            videoContainer.style.display = 'block';
            mainBtn.innerText = '⏹ 停止掃描';
            mainBtn.classList.add('stop');
            resultArea.innerHTML = currentMode === 'single' ? 
                '<strong>掃描結果：</strong> 對準條碼中...' : 
                '<strong>掃描結果：</strong> 請先對準上方第一條碼...';

            requestAnimationFrame(processFrame);
        } catch (err) {
            alert('相機啟動失敗：' + err.message);
            stopScanner();
        }
    }

    async function processFrame() {
        if (!isScanning) return;

        const video = document.getElementById('video');

        if (video.readyState === video.HAVE_ENOUGH_DATA && !isProcessing) {
            isProcessing = true;

            canvas.width = 640;
            canvas.height = video.videoHeight * (640 / video.videoWidth);
            ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

            try {
                // 確保 zbarWasm 全域函式存在
                if (typeof zbarWasm !== 'undefined') {
                    const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                    const symbols = await zbarWasm(imageData);

                    if (symbols && symbols.length > 0) {
                        for (let symbol of symbols) {
                            const codeVal = symbol.decode();
                            const typeName = (symbol.typeName || '').toUpperCase();

                            const isTargetFormat = (currentChannel === 'A' && typeName.includes('128')) ||
                                                   (currentChannel === 'B' && typeName.includes('39'));

                            if (isTargetFormat && codeVal) {
                                handleCapturedCode(codeVal, typeName);
                                break;
                            }
                        }
                    }
                }
            } catch (e) {
                console.error('解碼異常：', e);
            }

            isProcessing = false;
        }

        if (isScanning) {
            animFrameId = requestAnimationFrame(processFrame);
        }
    }

    function handleCapturedCode(codeVal, typeName) {
        const resultArea = document.getElementById('resultArea');

        if (navigator.vibrate) navigator.vibrate(80);

        if (currentMode === 'single') {
            resultArea.innerHTML = `
                <div style="color: #4ade80; font-weight: bold;">🎉 單條碼讀取成功！</div>
                <div>格式：${typeName}</div>
                <div>內容：<code>${codeVal}</code></div>
            `;
            saveToCollection([codeVal]);
            stopScanner();
        } else {
            if (dualBuffers.length === 0) {
                dualBuffers.push(codeVal);
                resultArea.innerHTML = `
                    <div style="color: #facc15; font-weight: bold;">⚠️ 已捕捉上條碼：${codeVal}</div>
                    <div>請將鏡頭移至下方第二條碼...</div>
                `;
                isProcessing = true;
                setTimeout(() => { isProcessing = false; }, 1200);
            } else if (dualBuffers.length === 1 && dualBuffers[0] !== codeVal) {
                dualBuffers.push(codeVal);
                resultArea.innerHTML = `
                    <div style="color: #4ade80; font-weight: bold;">🎉 雙條碼讀取完成！</div>
                    <div>上條碼：<code>${dualBuffers[0]}</code></div>
                    <div>下條碼：<code>${dualBuffers[1]}</code></div>
                `;
                saveToCollection(dualBuffers);
                stopScanner();
            }
        }
    }

    function saveToCollection(codes) {
        const cardList = document.getElementById('cardList');
        const emptyTip = cardList.querySelector('.empty-tip');
        if (emptyTip) emptyTip.remove();

        const channelTitle = currentChannel === 'A' ? '7-11' : '全家';
        const typeTitle = currentType === 'product' ? '商品卡' : '飲品卡';
        
        const item = document.createElement('div');
        item.className = 'saved-item';
        item.innerHTML = `
            <div style="color: #a78bfa; font-weight: bold; margin-bottom: 4px;">${channelTitle} - ${typeTitle}</div>
            ${codes.map((c, i) => `<div>條碼 ${i + 1}：<code>${c}</code></div>`).join('')}
        `;
        cardList.prepend(item);
    }

    function stopScanner() {
        isScanning = false;
        isProcessing = false;
        if (animFrameId) cancelAnimationFrame(animFrameId);
        if (mediaStream) {
            mediaStream.getTracks().forEach(t => t.stop());
            mediaStream = null;
        }
        document.getElementById('video').srcObject = null;
        document.getElementById('videoContainer').style.display = 'none';
        
        const mainBtn = document.getElementById('mainBtn');
        mainBtn.innerText = '▶ 啟動掃描';
        mainBtn.classList.remove('stop');
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OmniPass 歐米通：WASM 正確解析版</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; margin: 0; padding: 12px; color: #f8fafc; }
        .container { max-width: 480px; margin: 0 auto; background: #1e293b; padding: 16px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        h2 { font-size: 1.1rem; margin-top: 0; color: #38bdf8; text-align: center; }
        .action-btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 16px; background: #10b981; color: white; }
        .action-btn.stop { background: #ef4444; }
        .status-bar { margin-top: 12px; padding: 10px; background: #0f172a; border-radius: 8px; font-size: 0.80rem; color: #38bdf8; border: 1px solid #334155; }
        .error-log { margin-top: 10px; padding: 10px; background: #450a0a; border: 1px solid #ef4444; border-radius: 8px; font-size: 0.75rem; color: #fca5a5; display: none; word-break: break-all; }
        .video-container { position: relative; width: 100%; border-radius: 12px; overflow: hidden; margin-top: 12px; background: #000; display: none; border: 2px solid #334155; }
        video { width: 100%; display: block; object-fit: cover; max-height: 280px; }
        .roi-box { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 80%; height: 120px; border: 2px dashed #38bdf8; box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.5); pointer-events: none; border-radius: 8px; }
        .result-box { margin-top: 10px; padding: 10px; background: #0f172a; border-radius: 8px; font-size: 0.85rem; word-break: break-all; border: 1px solid #334155; }
    </style>
</head>
<body>

<div class="container">
    <h2>OmniPass 歐米通：模組修正版</h2>

    <button class="action-btn" id="mainBtn" onclick="toggleScanner()">▶ 啟動視訊連續掃描</button>

    <div class="status-bar" id="statusBar">
        狀態：等待啟動...
    </div>

    <div class="error-log" id="errorLog"></div>

    <div class="video-container" id="videoContainer">
        <video id="video" muted playsinline autoplay></video>
        <div class="roi-box"></div>
    </div>

    <div class="result-box" id="resultArea">
        <strong>掃描結果：</strong> 尚未讀取
    </div>
</div>

<script>
    let mediaStream = null;
    let scanInterval = null;
    let isScanning = false;
    let isProcessing = false;
    let zbarModule = null;

    function showError(msg) {
        const errBox = document.getElementById('errorLog');
        errBox.style.display = 'block';
        errBox.innerHTML = `⚠️ 錯誤：${msg}`;
        console.error(msg);
    }

    async function toggleScanner() {
        if (!isScanning) { 
            await startScanner(); 
        } else { 
            stopScanner(); 
        }
    }

    async function startScanner() {
        const mainBtn = document.getElementById('mainBtn');
        const videoContainer = document.getElementById('videoContainer');
        const videoElement = document.getElementById('video');
        const resultArea = document.getElementById('resultArea');
        const statusBar = document.getElementById('statusBar');

        document.getElementById('errorLog').style.display = 'none';

        try {
            statusBar.innerText = '狀態：正在載入 ZBar WASM 核心...';
            
            // 修正點：透過動態 ES 模組正確載入 zbar-wasm 及其方法
            if (!zbarModule) {
                zbarModule = await import('https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@latest/dist/index.js');
            }

            mainBtn.innerText = '⏹ 關閉視訊掃描';
            mainBtn.classList.add('stop');
            isScanning = true;
            videoContainer.style.display = 'block';
            statusBar.innerText = '狀態：正在開啟相機...';

            mediaStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
            }).catch(() => {
                return navigator.mediaDevices.getUserMedia({ video: true });
            });

            videoElement.srcObject = mediaStream;
            await videoElement.play();
            statusBar.innerText = '狀態：對準條碼中（請將條碼置於框內）...';

            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d', { willReadFrequently: true });

            scanInterval = setInterval(async () => {
                if (isProcessing) return;
                if (videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                    isProcessing = true;
                    try {
                        // 1. 降載畫布尺寸以提升效能
                        canvas.width = 640;
                        canvas.height = videoElement.videoHeight * (640 / videoElement.videoWidth);

                        // 2. 進行 ROI 區域裁切計算
                        const srcW = videoElement.videoWidth;
                        const srcH = videoElement.videoHeight;
                        const roiW = srcW * 0.8;
                        const roiH = 140; 
                        const roiX = (srcW - roiW) / 2;
                        const roiY = (srcH - roiH) / 2;

                        context.drawImage(videoElement, roiX, roiY, roiW, roiH, 0, 0, canvas.width, canvas.height);

                        // 3. 修正點：從 canvas 取出 ImageData，並呼叫 zbarModule.scanImageData
                        const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                        const symbols = await zbarModule.scanImageData(imageData);

                        if (symbols && symbols.length > 0) {
                            for (let symbol of symbols) {
                                const codeText = symbol.decode();
                                if (codeText) {
                                    resultArea.innerHTML = `
                                        <div style="color: #4ade80; font-weight: bold;">🎉 成功捕捉！</div>
                                        <div>類型：${symbol.typeName}</div>
                                        <div>內容：<code>${codeText}</code></div>
                                    `;
                                    if (navigator.vibrate) navigator.vibrate(100);
                                    stopScanner();
                                    break;
                                }
                            }
                        }
                    } catch (e) {
                        console.error("掃描解析執行錯誤：", e);
                    }
                    isProcessing = false;
                }
            }, 150);

        } catch (err) {
            showError(err.message);
            alert("啟動失敗：" + err.message);
            stopScanner();
        }
    }

    function stopScanner() {
        if (scanInterval) { clearInterval(scanInterval); scanInterval = null; }
        if (mediaStream) { mediaStream.getTracks().forEach(track => track.stop()); mediaStream = null; }
        document.getElementById('video').srcObject = null;
        document.getElementById('videoContainer').style.display = 'none';
        const mainBtn = document.getElementById('mainBtn');
        mainBtn.innerText = '▶ 啟動視訊連續掃描';
        mainBtn.classList.remove('stop');
        isScanning = false;
        isProcessing = false;
        document.getElementById('statusBar').innerText = '狀態：已停止';
    }
</script>

</body>
</html>
